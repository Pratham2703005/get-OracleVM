name: oracle-get-vm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: oracle-get-vm
  cancel-in-progress: false

permissions:
  contents: write   # commit vm-created.json
  actions: write    # disable this workflow once the VM exists

jobs:
  get-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Already created?
        id: gate
        run: |
          if [ -f vm-created.json ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "vm-created.json exists - VM was already created, skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCI CLI
        if: steps.gate.outputs.done != 'true'
        run: pip install --quiet -r requirements.txt

      - name: Try to get VM
        if: steps.gate.outputs.done != 'true'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: bash infra/oracle-get-vm.sh

      - name: Commit progress (keep-going.json / vm-created.json)
        if: always() && steps.gate.outputs.done != 'true'
        run: |
          files=""
          for f in keep-going.json vm-created.json; do [ -f "$f" ] && files="$files $f"; done
          if [ -n "$files" ] && [ -n "$(git status --porcelain $files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "chore: update run state"
            git push
          fi

      - name: Disable this workflow
        if: hashFiles('vm-created.json') != ''
        run: gh workflow disable oracle-get-vm.yml --repo "$GITHUB_REPOSITORY"
